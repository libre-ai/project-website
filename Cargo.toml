[workspace]
members = ["crates/site-server"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "EUPL-1.2"
repository = "https://github.com/libre-ai/project-website"

# Exact versions, each published at least three days before it was chosen (ADR 0009).
# Licences of the whole graph are checked by deny.toml (`bun run check:dependency-policy`).
[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
form_urlencoded = "=1.2.3"
getrandom = { version = "=0.3.4", default-features = false }
# Already in the graph through axum; named directly for the connection timers (`server.rs`).
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["http1", "server", "server-graceful", "service", "tokio"] }
idna = "=1.1.0"
lettre = { version = "=0.11.24", default-features = false, features = ["smtp-transport", "tokio1-rustls", "ring", "rustls-native-certs"] }
percent-encoding = "=2.3.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
sqlx = { version = "=0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "time", "tls-rustls-ring-native-roots"] }
time = { version = "=0.3.55", default-features = false, features = ["std", "formatting"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "net", "signal", "time", "fs", "sync", "io-util", "macros"] }
url = "=2.5.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
