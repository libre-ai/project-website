<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-05 · Carte du site</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #bf4520;
      --font-sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono: ui-monospace, Menlo, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 { font-size: clamp(1.25rem, 2vw + 0.75rem, 1.75rem); font-weight: 600; margin-bottom: 1.25rem; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 640px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · D-05 · Périmètre V1</p>
    <h1>Carte du site V1 (PRD §6)</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d05-title d05-desc">
        <title id="d05-title">Carte du site V1 (PRD §6)</title>
        <desc id="d05-desc">Arbre des pages V1 : une racine, huit routes fixes, et le gabarit de fiche produit /produits/:id sous /produits. Les pages générées valent huit plus le nombre de fiches.</desc>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors -->
        <g stroke="#4f5d75" stroke-width="1" fill="none">
          <path d="M 180 88 L 200 88 L 200 88"/>
          <path d="M 200 88 L 200 520"/>
          <path d="M 200 104 L 240 104"/>
          <path d="M 200 152 L 240 152"/>
          <path d="M 200 200 L 240 200"/>
          <path d="M 200 248 L 240 248"/>
          <path d="M 200 296 L 240 296"/>
          <path d="M 200 344 L 240 344"/>
          <path d="M 200 392 L 240 392"/>
          <path d="M 200 440 L 240 440"/>
          <path d="M 200 488 L 240 488"/>
          <path d="M 200 520 L 240 520"/>
          <path d="M 440 296 L 460 296"/>
          <path d="M 440 296 L 440 344"/>
          <path d="M 440 344 L 460 344"/>
        </g>

        <!-- Root -->
        <rect x="40" y="70" width="140" height="36" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="110" y="93" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">/ Accueil</text>

        <!-- Fixed routes -->
        <g font-family="ui-monospace, monospace" font-size="11" fill="#2d3142">
          <rect x="240" y="90" width="200" height="28" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="256" y="108">/mission · Mission</text>

          <rect x="240" y="138" width="200" height="28" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="256" y="156">/methode · Méthode</text>

          <rect x="240" y="186" width="200" height="28" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="256" y="204">/produits · Liste</text>

          <rect x="240" y="234" width="200" height="28" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="256" y="252">/preuves · Gates</text>

          <rect x="240" y="282" width="200" height="28" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="256" y="300">/produits/:id · Fiche</text>

          <rect x="240" y="330" width="200" height="28" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="256" y="348">/gouvernance · Décisions</text>

          <rect x="240" y="378" width="200" height="28" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="256" y="396">/corrections · Journal</text>

          <rect x="240" y="426" width="200" height="28" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="256" y="444">/contribuer · Forge</text>
        </g>

        <!-- Product template children: one page per card, generated -->
        <rect x="460" y="282" width="300" height="28" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="476" y="300" fill="#2d3142" font-size="11" font-family="ui-monospace, monospace">une page par fiche, générée</text>
        <rect x="460" y="330" width="300" height="28" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="476" y="348" fill="#2d3142" font-size="11" font-family="ui-monospace, monospace">citation et flux depuis le même corpus</text>

        <text x="40" y="530" fill="#4f5d75" font-size="10" font-family="ui-monospace, monospace">Pages : 8 fixes + N fiches. Le gabarit /produits/:id reçoit une page par fiche.</text>
      </svg>
    </div>
  </div>
</body>
</html>
