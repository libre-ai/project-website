<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-04 · Parcours contributeur</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #bf4520;
      --font-sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono: ui-monospace, Menlo, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 { font-size: clamp(1.25rem, 2vw + 0.75rem, 1.75rem); font-weight: 600; margin-bottom: 1.25rem; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 640px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · D-04 · Contribuer (P3)</p>
    <h1>Parcours contributeur : de la méthode à la proposition</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d04-title d04-desc">
        <title id="d04-title">Parcours contributeur : de la méthode à la proposition</title>
        <desc id="d04-desc">Le contributeur lit la méthode, puis la gouvernance et le journal des corrections. Il contribue ensuite via la forge publique, dans le cadre de CONTRIBUTING et du DCO. Le site n'accepte aucune modification anonyme.</desc>
        <defs>
          <marker id="d04-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="d04-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Main path -->
        <line x1="220" y1="144" x2="260" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d04-arrow)"/>
        <line x1="440" y1="144" x2="480" y2="144" stroke="#bf4520" stroke-width="1.4" marker-end="url(#d04-accent)"/>
        <line x1="660" y1="144" x2="700" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d04-arrow)"/>

        <!-- Governance path -->
        <line x1="130" y1="168" x2="130" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d04-arrow)"/>
        <line x1="220" y1="260" x2="260" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d04-arrow)"/>

        <!-- Row 1 -->
        <rect x="40" y="120" width="180" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="130" y="141" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Lire la méthode</text>
        <text x="130" y="156" fill="#4f5d75" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">/methode</text>

        <rect x="260" y="120" width="180" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="350" y="141" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Suivre les règles</text>
        <text x="350" y="156" fill="#4f5d75" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">/contribuer</text>

        <rect x="480" y="120" width="180" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="570" y="141" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Forge publique</text>
        <text x="570" y="156" fill="#4f5d75" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">issues, pull requests</text>

        <rect x="700" y="120" width="180" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="790" y="141" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Cadre de contribution</text>
        <text x="790" y="156" fill="#4f5d75" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">CONTRIBUTING, DCO</text>

        <!-- Row 2: governance and corrections -->
        <rect x="40" y="236" width="180" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="130" y="257" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Gouvernance</text>
        <text x="130" y="272" fill="#4f5d75" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">/gouvernance</text>

        <rect x="260" y="236" width="180" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="350" y="257" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Journal des corrections</text>
        <text x="350" y="272" fill="#4f5d75" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">/corrections, daté</text>

        <text x="40" y="324" fill="#4f5d75" font-size="9" font-family="ui-monospace, monospace">Aucune modification anonyme : le site n'accepte aucun contenu. Toute proposition passe par la forge.</text>
      </svg>
    </div>
  </div>
</body>
</html>
